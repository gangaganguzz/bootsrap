<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>
<body>
    <div id="demo" class="carousel slide" data-ride="carousel">
  <ul class="carousel-indicators">
    <li data-target="#demo" data-slide-to="0" class="active"></li>
    <li data-target="#demo" data-slide-to="1"></li>
    <li data-target="#demo" data-slide-to="2"></li>
  </ul>
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="https://i.pinimg.com/736x/74/cb/eb/74cbebd948988a85a4ec89f5ebb2b75f.jpg" alt="mysore" width="100%" height="800px">
       <div class="carousel-caption">
        <h1 class="text-white">Mysore Palace</h1>
      </div>   
    </div>
     
    <div class="carousel-item">
      <img src="https://i.pinimg.com/736x/b7/20/af/b720afc2455458c6147c81d22337ffa5.jpg" alt="tajmahal" width="100%" height="800px">
       <div class="carousel-caption">
        <h1 class="text-white">Taj mahal</h1>
       </div>
       </div>
    <div class="carousel-item">
      <img src="https://i.pinimg.com/736x/2a/53/89/2a53893cf6fb0c769c8fa143281a38bb.jpg" alt="mumbai" width="100%" height="800px">   
       <div class="carousel-caption">
        <h1 class="text-white">Mumbai</h1>
      </div>   
    </div>
  </div>
  <a class="carousel-control-prev" href="#demo" data-slide="prev">
    <span class="carousel-control-prev-icon"></span>
  </a>
  <a class="carousel-control-next" href="#demo" data-slide="next">
    <span class="carousel-control-next-icon"></span>
  </a>
</div>
  <h2 style="text-align: center;">Booking your ticket</h2>
  <button type="button" class="btn btn-info mx-auto d-block" data-toggle="modal" data-target="#myModal">
    Book now
  </button>
  <div class="modal" id="myModal">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h4 class="modal-title">Book Your Dream Trip</h4>
          <button type="button" class="close" data-dismiss="modal">&times;</button>
        </div>
        <div class="modal-body">
          “Ready to explore? Book your trip with us and enjoy an unforgettable travel experience. Get more details about packages, pricing, and available dates.”
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-danger" data-dismiss="modal">Close</button>
        </div>
        </div>
    </div>
    </div>
  
</body>
</html>

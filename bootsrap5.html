<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team profile</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>
<body>
    <div class="container">
        <h1 class="display-2">NovaTech Solutions</h1>
        <h2 class="display-3">Meet Our Amazing Team</h2>
        <blockquote class="blockquote">
            "Great things are achieved when we work together"
        </blockquote>
        <section>
            <ul>
               <li>Teamwork</li>
               <li>Innovation</li> 
               <li>Excellence</li>
            </ul>
        </section>
        <img src="https://i.pinimg.com/736x/c9/86/71/c98671f726e4d9f1efa7efceac13d586.jpg" alt="team image" class="rounded-circle mx-auto d-block" width="300px" height="300px">
        <table class=" table table-bordered">
            <thead>
               <tr>
                <th>Name</th>
                <th>Roles</th>
                <th>Status</th>
               </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Rahul</td>
                    <td>Project Manager</td>
                    <td class="table-success">Active</td>
                </tr>
                <tr>
                    <td>Anjali</td>
                    <td>software developer</td>
                    <td class="table-danger">Leave</td>
                </tr>
                <tr>
                    <td>Arjun</td>
                    <td>UI/UX Designer</td>
                    <td class="table-warning">Resigned</td>
                </tr>
            </tbody>
        </table>
        <div class="alert alert-warning">some employees are currently not active.</div>
    </div>
</body>
</html>

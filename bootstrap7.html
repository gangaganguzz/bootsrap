<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>progress Dashboard</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>
<body>
    <div class="container">
    <ul class = "breadcrumb">
   <li class = "breadcrumb-item"><a href = "https://www.mashupstack.com">Home</a></li>
   <li class = "breadcrumb-item"><a href="https://www.mashupstack.com/list-courses">Courses</a></li>
   <li class = "breadcrumb-item active" aria-current = "page"><a href="https://www.mashupstack.com/list-courses">Web development</a></li>
</ul>
<h1>Web Development Course
<span class="badge badge-info" style="font-size: large;">New</span><br><br>
  </h1>
  <h3>HTML</h3>
  <div class="progress">
    <div class="progress-bar progress-bar-striped bg-success" style="width: 100%;">100%</div>
  </div><br>
  <h3>CSS</h3>
  <div class="progress">
    <div class="progress-bar progress-bar-striped progress-bar-animated bg-primary" style="width:75%;">75%</div>
  </div><br>
  <h3>Javascript</h3>
  <div class="progress">
    <div class="progress-bar bg-warning" style="width:50%;">50%</div>
  </div><br>
  <h3>bootstrap</h3>
   <div class="progress">
    <div class="progress-bar bg-danger" style="width:25%;">25%</div>
  </div><br><br>
  <button class="btn btn-success">Start</button>
  <button class="btn btn-warning">Pause</button>
  <button class="btn btn-danger">Reset</button><br><br>
  <ul class="pagination justify-content-center">
  <li class="page-item"><a class="page-link" href="#">previous</a></li>
  <li class="page-item active "><a class="page-link" href="#">1</a></li>
  <li class="page-item"><a class="page-link" href="#">2</a></li>
  <li class="page-item disabled"><a class="page-link" href="#">3</a></li>
  <li class="page-item"><a class="page-link" href="#">next</a></li>
  </ul>
</body>
</html>
